# =====================================================================
#  PIPELINE API (apps/api) : intégration et déploiement continus
# =====================================================================
#  Toute branche / PR : secrets (gitleaks) -> audit -> TESTS UNITAIRES (Jest) -> build
#  develop            : image Docker GHCR + scan Trivy -> déploiement RECETTE (runner)
#  tag vX.Y.Z         : image versionnée -> validation manuelle -> déploiement PRODUCTION
#  Aucun script manuel : tout est déclenché par git (push, Pull Request, tag).
# =====================================================================
name: Pipeline API

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  secrets-scan:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (tout l'historique)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1

  tests:
    name: Audit + tests unitaires + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      NODE_ENV: test
      JWT_SECRET: secret-de-test-ci
      DATABASE_URL: mysql://test:test@localhost:3306/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Tests unitaires (Jest) avec couverture
        run: npm run test:ci
      - name: Compilation TypeScript
        run: npm run build
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api
          path: apps/api/coverage/
          retention-days: 14

  fonctionnels:
    name: Tests fonctionnels et de non-régression (MySQL réel)
    runs-on: ubuntu-latest
    needs: tests
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: cesizen_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: mysql://root:root-ci@127.0.0.1:3306/cesizen_ci
      JWT_SECRET: secret-fonctionnel-ci
      NODE_ENV: test
      PORT: '3001'
      ADMIN_EMAIL: admin.ci@cesizen.test
      ADMIN_PASSWORD: AdminCI!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Base fantôme pour comparer le schéma
        run: mysql -h 127.0.0.1 -uroot -proot-ci -e "CREATE DATABASE shadow_ci"
      - name: Non-régression du schéma (aucune modification sans migration)
        run: npx prisma migrate diff --from-migrations src/prisma/migrations --to-schema-datamodel src/prisma/schema.prisma --shadow-database-url mysql://root:root-ci@127.0.0.1:3306/shadow_ci --exit-code
      - name: Base neuve - migrations + compte admin
        run: |
          npx prisma generate
          npm run build
          npx prisma migrate deploy
          npm run seed:prod
      - name: Démarrage de l'API
        run: nohup node dist/index.js > api.log 2>&1 &
      - name: Recette fonctionnelle (29 vérifications, 3 modules)
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'
          API_URL=http://localhost:3001 node tests-fonctionnels/recette-api.mjs
      - name: Résultats de la recette
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-api
          path: |
            apps/api/tests-fonctionnels/resultats.json
            apps/api/api.log
          retention-days: 30

  infra:
    name: Validation Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet

  image:
    name: Image Docker API (GHCR + Trivy)
    runs-on: ubuntu-latest
    needs: [secrets-scan, tests, fonctionnels, infra]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cesizen-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{raw}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Scan de vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'

  deploy-recette:
    name: Déploiement RECETTE (API)
    needs: image
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, cesizen-recette]
    concurrency:
      group: deploy-recette
      cancel-in-progress: false
    environment:
      name: recette
      url: ${{ vars.APP_URL }}
    env:
      COMPOSE_PROJECT_NAME: cesizen-recette
      API_TAG: develop
      WEB_TAG: develop
      WEB_PORT: ${{ vars.WEB_PORT }}
      CORS_ORIGINS: ${{ vars.APP_URL }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Récupération de l'image
        run: docker compose -f infra/docker-compose.yml pull api
      - name: Mise à jour du conteneur API (migrations + healthcheck)
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180 api
      - name: Compte administrateur de recette (seed)
        if: vars.ADMIN_EMAIL != ''
        run: docker compose -f infra/docker-compose.yml exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD api node dist/prisma/seed.js
      - name: Test de fumée
        run: docker compose -f infra/docker-compose.yml exec -T api wget -qO- http://127.0.0.1:3001/api/health
      - run: docker image prune -f

  deploy-prod:
    name: Déploiement PRODUCTION (API)
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, cesizen-prod]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      COMPOSE_PROJECT_NAME: cesizen-prod
      API_TAG: ${{ github.ref_name }}
      WEB_TAG: ${{ github.ref_name }}
      WEB_PORT: ${{ vars.WEB_PORT }}
      CORS_ORIGINS: ${{ vars.APP_URL }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sauvegarde de la base avant mise en production
        continue-on-error: true
        run: docker compose -f infra/docker-compose.yml exec -T mysql sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction cesizen | gzip > /backups/avant-${{ github.ref_name }}.sql.gz'
      - run: docker compose -f infra/docker-compose.yml pull api
      - name: Mise à jour du conteneur API (migrations + healthcheck)
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180 api
      - name: Test de fumée
        run: docker compose -f infra/docker-compose.yml exec -T api wget -qO- http://127.0.0.1:3001/api/health
      - run: docker image prune -f
