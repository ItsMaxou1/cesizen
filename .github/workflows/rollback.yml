# Retour arrière de la production vers une version précédente (sans script manuel :
# on lance ce workflow depuis l'onglet Actions en choisissant le tag, ex. v1.0.0)
name: Rollback PRODUCTION

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à redéployer (tag existant, ex. v1.0.0)'
        required: true

jobs:
  rollback:
    runs-on: [self-hosted, cesizen-prod]
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      COMPOSE_PROJECT_NAME: cesizen-prod
      API_TAG: ${{ inputs.version }}
      WEB_TAG: ${{ inputs.version }}
      WEB_PORT: ${{ vars.WEB_PORT }}
      CORS_ORIGINS: ${{ vars.APP_URL }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          sparse-checkout: infra
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose -f infra/docker-compose.yml pull
      - run: docker compose -f infra/docker-compose.yml up -d --remove-orphans --wait --wait-timeout 180
      - run: docker compose -f infra/docker-compose.yml exec -T web wget -qO- http://api:3001/api/health
