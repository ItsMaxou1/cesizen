# =====================================================================
#  Pipeline CI/CD CESIZen (monorepo : apps/api, apps/web, apps/mobile)
# =====================================================================
#  Toute branche / Pull Request : intégration continue
#     secrets (gitleaks) -> audit dépendances -> tests -> build -> lint
#  Branche develop : livraison continue en RECETTE
#     images Docker -> GHCR -> scan Trivy -> déploiement par le runner auto-hébergé
#  Tag vX.Y.Z (créé depuis main) : livraison en PRODUCTION
#     mêmes images, versionnées -> validation manuelle (environnement protégé) -> déploiement
#  Aucun script n'est lancé à la main : tout est déclenché par git (push / tag).
# =====================================================================
name: CI/CD CESIZen

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------- CI
  secrets-scan:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1

  api:
    name: API - audit, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      NODE_ENV: test
      JWT_SECRET: secret-de-test-ci
      DATABASE_URL: mysql://test:test@localhost:3306/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Tests (Jest) avec couverture
        run: npm run test:ci
      - name: Compilation TypeScript
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture-api
          path: apps/api/coverage/
          retention-days: 14

  web:
    name: Web - audit, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build (TypeScript + Vite)
        run: npm run build

  mobile:
    name: Mobile - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Vérification TypeScript
        run: npx tsc --noEmit
      - name: Tests (Jest / Testing Library)
        run: npx jest --ci

  infra:
    name: Infra - validation Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet

  # ---------------------------------------------------------------- CD : images
  images:
    name: Image ${{ matrix.app }} (GHCR + Trivy)
    runs-on: ubuntu-latest
    needs: [secrets-scan, api, web, mobile, infra]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cesizen-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{raw}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan de vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'

  # ---------------------------------------------------------------- CD : déploiements
  deploy-recette:
    name: Déploiement RECETTE
    needs: images
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, cesizen-recette]
    environment:
      name: recette
      url: ${{ vars.APP_URL }}
    env:
      COMPOSE_PROJECT_NAME: cesizen-recette
      API_TAG: develop
      WEB_TAG: develop
      WEB_PORT: ${{ vars.WEB_PORT }}
      CORS_ORIGINS: ${{ vars.APP_URL }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Récupération des images
        run: docker compose -f infra/docker-compose.yml pull
      - name: Mise à jour des conteneurs (attente des healthchecks)
        run: docker compose -f infra/docker-compose.yml up -d --remove-orphans --wait --wait-timeout 180
      - name: Test de fumée (API joignable via le proxy)
        run: docker compose -f infra/docker-compose.yml exec -T web wget -qO- http://api:3001/api/health
      - name: Nettoyage des anciennes images
        run: docker image prune -f

  deploy-prod:
    name: Déploiement PRODUCTION
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, cesizen-prod]
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      COMPOSE_PROJECT_NAME: cesizen-prod
      API_TAG: ${{ github.ref_name }}
      WEB_TAG: ${{ github.ref_name }}
      WEB_PORT: ${{ vars.WEB_PORT }}
      CORS_ORIGINS: ${{ vars.APP_URL }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sauvegarde de la base avant mise en production
        continue-on-error: true
        run: docker compose -f infra/docker-compose.yml exec -T mysql sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction cesizen | gzip > /backups/avant-${{ github.ref_name }}.sql.gz'
      - name: Récupération des images
        run: docker compose -f infra/docker-compose.yml pull
      - name: Mise à jour des conteneurs (attente des healthchecks)
        run: docker compose -f infra/docker-compose.yml up -d --remove-orphans --wait --wait-timeout 180
      - name: Test de fumée
        run: docker compose -f infra/docker-compose.yml exec -T web wget -qO- http://api:3001/api/health
      - name: Nettoyage des anciennes images
        run: docker image prune -f
